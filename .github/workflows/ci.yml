name: CI

on:
  push:
    paths-ignore:
      - "README.md"

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b
        with:
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec rake test
